version: v1
stage: bdd_cpu
source: feature_generator_llm.py::_create_cpu_prompt (one instruction per row; branches checked by effect)
system: You are a hardware verification expert specializing in BDD test generation.
user: "You are an expert in hardware verification and BDD (Behavior-Driven Development).\n    Generate a Gherkin-format Feature file for RISC-V RV32I CPU testing.\n\n    CRITICAL FORMAT REQUIREMENTS:\n    1. Use strict Gherkin syntax with Scenario Outline and Examples tables\n    2. Examples table MUST use pipe (|) separators with consistent spacing\n    3. Every Examples row describes EXACTLY ONE instruction. Never put two\n       instructions, or a store and a load, in the same row.\n    4. The instruction column holds assembly text with register names written\n       as x0..x31, for example: add x3, x1, x2\n    5. Values may be decimal or 0x-hex. Negative values are allowed.\n\n    EXAMPLE FORMAT:\n\n    Feature: RISC-V CPU Verification ({{ pipeline_stages }}-stage pipeline)\n      As a hardware verification engineer\n      I want to verify the RISC-V CPU implementation\n      So that I can ensure correct instruction execution\n\n      Background:\n        Given the CPU is a {{ pipeline_stages }}-stage pipeline RV32I processor\n        And all registers are initialized to 0\n\n      @arithmetic\n      Scenario Outline: Instructions that write a register\n        Given register x<rs1> contains <rs1_value>\n        And register x<rs2> contains <rs2_value>\n        When I execute <instruction>\n        Then register x<rd> should contain <expected>\n\n        Examples:\n          | instruction      | rs1 | rs1_value | rs2 | rs2_value | rd | expected |\n          | add x3, x1, x2   | 1   | 10        | 2   | 20        | 3  | 30       |\n          | sub x3, x1, x2   | 1   | 30        | 2   | 10        | 3  | 20       |\n          | addi x3, x1, 100 | 1   | 50        | 0   | 0         | 3  | 150      |\n\n      @logical\n      Scenario Outline: Bitwise instructions\n        Given register x<rs1> contains <rs1_value>\n        And register x<rs2> contains <rs2_value>\n        When I execute <instruction>\n        Then register x<rd> should contain <expected>\n\n        Examples:\n          | instruction     | rs1 | rs1_value | rs2 | rs2_value | rd | expected |\n          | and x3, x1, x2  | 1   | 0xFF      | 2   | 0x0F      | 3  | 0x0F     |\n          | or x3, x1, x2   | 1   | 0xF0      | 2   | 0x0F      | 3  | 0xFF     |\n          | xori x3, x1, 15 | 1   | 0xFF      | 0   | 0         | 3  | 0xF0     |\n\n      @compare\n      Scenario Outline: Signed comparison\n        Given register x<rs1> contains <rs1_value>\n        And register x<rs2> contains <rs2_value>\n        When I execute <instruction>\n        Then register x<rd> should contain <expected>\n\n        Examples:\n          | instruction     | rs1 | rs1_value | rs2 | rs2_value | rd | expected |\n          | slt x3, x1, x2  | 1   | -1        | 2   | 1         | 3  | 1        |\n          | slt x3, x1, x2  | 1   | 5         | 2   | 3         | 3  | 0        |\n          | slti x3, x1, 0  | 1   | -1        | 0   | 0         | 3  | 1        |\n\n      @memory\n      Scenario Outline: Load and store, one instruction per row\n        Given register x<rs1> contains address <rs1_value>\n        And memory at that address contains <mem_value>\n        When I execute <instruction>\n        Then register x<rd> should contain <expected>\n\n        Examples:\n          | instruction    | rs1 | rs1_value | rs2 | rs2_value | rd | mem_value | expected |\n          | lw x3, 0(x1)   | 1   | 0x100     | 0   | 0         | 3  | 0x1234    | 0x1234   |\n          | sw x2, 0(x1)   | 1   | 0x140     | 2   | 0xABCD    | 0  | 0         | 0xABCD   |\n\n      @branch\n      Scenario Outline: Branch taken or not taken\n        Given register x<rs1> contains <rs1_value>\n        And register x<rs2> contains <rs2_value>\n        When I execute <instruction>\n        Then the branch is taken should be <taken>\n\n        Examples:\n          | instruction    | rs1 | rs1_value | rs2 | rs2_value | taken |\n          | beq x1, x2, 8  | 1   | 10        | 2   | 10        | yes   |\n          | beq x1, x2, 8  | 1   | 10        | 2   | 20        | no    |\n          | bne x1, x2, 8  | 1   | 10        | 2   | 20        | yes   |\n          | blt x1, x2, 8  | 1   | -5        | 2   | 3         | yes   |\n          | bge x1, x2, 8  | 1   | -5        | 2   | 3         | no    |\n\n    NOW GENERATE:\n    - Architecture: RV32I, {{ pipeline_stages }}-stage pipeline\n    - At least {{ req['num_tests'] }} rows per scenario type\n    - Cover these instructions, each in the scenario type that fits it:\n      ADD SUB AND OR XOR SLT, ADDI ANDI ORI XORI SLTI, LW, SW, BEQ BNE BLT BGE\n    - For @branch, give both a taken and a not-taken row for every branch\n      instruction, and use signed values for BLT and BGE so the signed\n      comparison is exercised\n    - Keep every rs1_value and rs2_value within -2048..2047. The CPU has no\n      LUI, so the testbench can only preload a register with a single ADDI;\n      rows outside that range cannot be set up and will be dropped.\n    - Within that range include boundary values: 0, 1, -1, 2047, -2048\n\n    Generate the complete Feature file following the exact format above.\n    Output ONLY the Feature file content, no explanations.\n    "
variables:
- pipeline_stages
- pipeline_stages
- pipeline_stages
- req['num_tests']
