version: v2
stage: bdd_alu
source: feature_generator_llm.py::_create_alu_prompt (v2 = v1 + one reset scenario, D50)
system: You are a hardware verification expert specializing in BDD test generation.
user: "You are an expert in hardware verification and BDD (Behavior-Driven Development).\n    Generate a Gherkin-format Feature file for ALU testing.\n\n    CRITICAL FORMAT REQUIREMENTS:\n    1. Use strict Gherkin syntax with Scenario Outline and Examples tables\n    2. Examples table MUST use pipe (|) separators with consistent spacing\n    3. Each operation MUST have at least {{ req['num_tests'] }} test cases\n    4. MUST include these specific edge cases:\n       - Test with (0, 0)\n       - Test with ({{ max_value }}, {{ max_value }}) - maximum values\n       - Test cases that trigger overflow\n    5. Follow the EXACT format shown below\n\n    EXAMPLE FORMAT (8-bit) — this shows the required LAYOUT only. Do not copy the\n    operations shown here; generate scenarios for the operations listed under\n    \"NOW GENERATE\" below, and only those.\n\n    Feature: 8-bit ALU Verification\n      As a hardware verification engineer\n      I want to verify the ALU implementation\n      So that I can ensure correct operation\n\n      Background:\n        Given the ALU is initialized with 8-bit operands\n\n{{ example_block }}\n\n    RESET (the design has clk and rst): add exactly one scenario that applies reset after an operation,\n    written like this, with 2 or 3 rows. After reset the result and all three flags are 0 (False):\n\n      @reset\n      Scenario Outline: Reset clears the outputs\n        Given I have operand A = <A>\n        And I have operand B = <B>\n        When reset is asserted\n        Then the result should be <Expected_Result>\n        And the zero flag should be <Zero_Flag>\n        And the negative flag should be <Negative_Flag>\n        And the overflow flag should be <Overflow_Flag>\n\n        Examples:\n          | A   | B  | Opcode | Expected_Result | Zero_Flag | Negative_Flag | Overflow_Flag |\n          | 100 | 27 | 0000   | 0               | False     | False         | False         |\n\n    NOW GENERATE:\n    - Bitwidth: {{ req['bitwidth'] }}-bit\n    - Operations to include (generate scenarios for these and NO others):\n    - {{ ops_str }}\n    - Each operation needs {{ req['num_tests'] }} test cases minimum\n    - Maximum value for {{ req['bitwidth'] }}-bit: {{ max_value }}\n    - MUST include edge cases: (0,0), ({{ max_value }},{{ max_value }}), and overflow tests\n{{ op_notes }}\n\n    Generate the complete Feature file following the exact format above.\n    Output ONLY the Feature file content, no explanations.\n    "
variables:
- req['num_tests']
- max_value
- max_value
- example_block
- req['bitwidth']
- ops_str
- req['num_tests']
- req['bitwidth']
- max_value
- max_value
- max_value
- op_notes
