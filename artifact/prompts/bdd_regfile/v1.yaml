version: v1
stage: bdd_regfile
source: feature_generator_llm.py::_create_regfile_prompt (example format rewritten to one operation per row)
system: You are a hardware verification expert specializing in BDD test generation.
user: "You are an expert in hardware verification and BDD (Behavior-Driven Development).\n    Generate a Gherkin-format Feature file for Register File testing.\n\n    CRITICAL FORMAT REQUIREMENTS:\n    1. Use strict Gherkin syntax with Scenario Outline and Examples tables\n    2. Examples table MUST use pipe (|) separators with consistent spacing\n    3. Every Examples row describes EXACTLY ONE operation on EXACTLY ONE\n       register. Never put two registers or two steps in one row.\n    4. Use ONLY these column names: addr, data, expected\n    5. Tag every Scenario Outline with exactly one of @write, @read,\n       @write_read, @reset\n    6. Rows execute in the order they appear and the register contents\n       persist from one row to the next, so a value written in an early row\n       must still be there when a later row reads it\n\n    EXAMPLE FORMAT:\n\n    Feature: {{ depth }}x{{ req['bitwidth'] }}-bit Register File Verification\n      As a hardware verification engineer\n      I want to verify the Register File implementation\n      So that I can ensure correct read/write behavior\n\n      Background:\n        Given the Register File has {{ depth }} registers of {{ req['bitwidth'] }}-bit width\n\n      @write\n      Scenario Outline: Write values into registers\n        Given the register file is ready\n        When I write <data> to register <addr>\n        Then the write is accepted\n\n        Examples:\n          | addr | data |\n          | 1    | 100  |\n          | 2    | 255  |\n          | 5    | {{ max_value }} |\n\n      @read\n      Scenario Outline: Read back values written earlier\n        Given the register file holds earlier writes\n        When I read register <addr>\n        Then the value should be <expected>\n\n        Examples:\n          | addr | expected |\n          | 1    | 100      |\n          | 2    | 255      |\n          | 5    | {{ max_value }} |\n\n      @write_read\n      Scenario Outline: Write and immediately read back\n        Given the register file is ready\n        When I write <data> to register <addr>\n        And I read register <addr>\n        Then the value should be <expected>\n\n        Examples:\n          | addr | data | expected |\n          | 7    | 42   | 42       |\n\n      @write\n      Scenario Outline: Writes to register 0 are ignored\n        Given the register file is ready\n        When I write <data> to register <addr>\n        Then the write is discarded\n\n        Examples:\n          | addr | data |\n          | 0    | 123  |\n\n      @read\n      Scenario Outline: Register 0 always reads as zero\n        Given register 0 is hardwired\n        When I read register <addr>\n        Then the value should be <expected>\n\n        Examples:\n          | addr | expected |\n          | 0    | 0        |\n\n      @reset\n      Scenario Outline: Reset clears every register\n        Given registers hold values\n        When reset is asserted\n        Then register <addr> is cleared\n\n        Examples:\n          | addr |\n          | 1    |\n\n      @read\n      Scenario Outline: Everything reads zero after reset\n        Given reset has completed\n        When I read register <addr>\n        Then the value should be <expected>\n\n        Examples:\n          | addr | expected |\n          | 1    | 0        |\n          | 2    | 0        |\n\n    NOW GENERATE:\n    - Bitwidth: {{ req['bitwidth'] }}-bit\n    - Depth: {{ depth }} registers (valid addresses are 0 to {{ depth }}-1)\n    - Address width: {{ addr_width }} bits\n    - Maximum data value: {{ max_value }}\n    - Include at least {{ req['num_tests'] }} rows per scenario type\n    - Separate a write from the read that checks it by at least one other\n      write, so the sequence actually exercises stored state\n    - Include a register that is written twice, with a read after each write\n\n    Generate the complete Feature file following the exact format above.\n    Output ONLY the Feature file content, no explanations.\n    "
variables:
- depth
- req['bitwidth']
- depth
- req['bitwidth']
- max_value
- max_value
- max_value
- req['bitwidth']
- depth
- addr_width
- max_value
- req['num_tests']
