version: v2
stage: duv_alu
source: derived from v1.yaml by scratchpad/t2_make_v2.py (combinational variant; only timing-related lines differ)
system: You are an expert Verilog hardware designer. Generate high-quality, synthesizable RTL code.
user: "Generate a high-quality, synthesizable Verilog RTL design for a {{ bitwidth }}-bit ALU.\nREQUIREMENTS:\n\n1. Module Interface:\n   - Module name: {{ module_name }}\n   - Inputs:\n     * a: {{ bitwidth }}-bit operand A\n     * b: {{ bitwidth }}-bit operand B  \n     * opcode: 4-bit operation selector\n   - Outputs:\n     * result: {{ bitwidth }}-bit result\n     * zero: zero flag (result == 0)\n     * overflow: overflow flag\n     * negative: negative flag (MSB of result)\n\n2. Operations to implement:\n{{ ops_text }}\n\n3. Design Requirements:\n   - Purely combinational design: no clock, no reset, no state\n   - Outputs must settle from the inputs within the same evaluation\n   - Combinational logic for operations\n   - Clean, readable code with comments\n   - Synthesizable RTL (no delays, no X/Z)\n\n4. Code Quality:\n   - Use Verilog-2001 syntax ONLY (NOT SystemVerilog)\n   - Do NOT use inline for-loop variable declarations like for(integer i=0;...)\n     Instead declare integer i; BEFORE the for loop\n   - Do NOT use `logic` type - use `reg` and `wire` only\n   - Include module header comments\n   - Comment each operation case\n   - Use meaningful signal names\n   - Proper indentation\n\nIMPORTANT VERILOG SYNTAX RULE:\n   - When a case branch has MORE THAN ONE statement, you MUST wrap them\n     in begin/end blocks. Failure to do so causes syntax errors.\n   - Example: 4'b0000: begin ... end  (NOT 4'b0000: stmt1; stmt2;)\n\nEXAMPLE STRUCTURE:\n```verilog\nmodule {{ module_name }} (\n    input wire [{{ bitwidth - 1 }}:0] a,\n    input wire [{{ bitwidth - 1 }}:0] b,\n    input wire [3:0] opcode,\n    output reg [{{ bitwidth - 1 }}:0] result,\n    output reg zero,\n    output reg overflow,\n    output reg negative\n);\n\n    // Combinational logic for operations\n    always @(*) begin\n        overflow = 1'b0;\n        case (opcode)\n            4'b0000: begin // ADD\n                result = a + b;\n                overflow = (a[{{ bitwidth - 1 }}] & b[{{ bitwidth - 1 }}] & ~result[{{ bitwidth - 1 }}]) |\n                           (~a[{{ bitwidth - 1 }}] & ~b[{{ bitwidth - 1 }}] & result[{{ bitwidth - 1 }}]);\n            end\n            4'b0001: begin // SUB\n                result = a - b;\n                overflow = (a[{{ bitwidth - 1 }}] & ~b[{{ bitwidth - 1 }}] & ~result[{{ bitwidth - 1 }}]) |\n                           (~a[{{ bitwidth - 1 }}] & b[{{ bitwidth - 1 }}] & result[{{ bitwidth - 1 }}]);\n            end\n            4'b0010: result = a & b;  // AND (single statement, no begin/end needed)\n            4'b0011: result = a | b;  // OR\n            default: result = {{ bitwidth }}'b0;\n        endcase\n        zero     = (result == 0);\n        negative = result[{{ bitwidth - 1 }}];\n    end\n\nendmodule\n```\n\nGenerate ONLY the Verilog code. No explanations before or after.\nStart with `module` and end with `endmodule`.\n"
